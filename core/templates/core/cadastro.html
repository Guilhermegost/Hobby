<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Criar conta | Meu Espaço</title>
    <style>
        *{box-sizing:border-box}body{margin:0;background:#e9ebee;color:#1d2129;font:15px Arial,sans-serif}.bar{height:64px;background:#3b5998;color:white;display:flex;align-items:center;padding:0 max(calc((100% - 980px)/2),24px);font-size:23px;font-weight:bold}.wrap{max-width:440px;margin:52px auto;padding:0 18px}.card{background:white;border:1px solid #dddfe2;border-radius:5px;padding:24px;box-shadow:0 2px 6px #0001}h1{margin:0 0 8px;font-size:26px}header p{color:#606770;margin:0 0 22px}.card label{display:block;font-weight:bold;margin:15px 0 6px}.card input{width:100%;padding:11px;border:1px solid #ccd0d5;border-radius:4px;font-size:16px}.helptext{display:block;color:#606770;font-size:12px;line-height:1.45;margin-top:5px}.errorlist{color:#b42318;padding-left:20px;margin:6px 0}.submit{width:100%;border:0;border-radius:4px;background:#42b72a;color:white;padding:12px;margin-top:18px;font-size:17px;font-weight:bold;cursor:pointer}.back{text-align:center;margin-top:18px}.back a{color:#3b5998;text-decoration:none;font-weight:bold}
    </style>
</head>
<body>
    <div class="bar">Meu Espaço</div>
    <main class="wrap">
        <section class="card">
            <header><h1>Criar sua conta</h1><p>É rápido e fácil.</p></header>
            <form method="post">
                {% csrf_token %}
                {% for field in form %}
                    <label for="{{ field.id_for_label }}">{% if field.name == 'username' %}Nome de usuário{% elif field.name == 'password1' %}Senha{% else %}Confirme a senha{% endif %}</label>
                    {{ field }}
                    {% if field.help_text %}<small class="helptext">{{ field.help_text }}</small>{% endif %}
                    {{ field.errors }}
                {% endfor %}
                <button class="submit" type="submit">Criar conta</button>
            </form>
            <div class="back"><a href="{% url 'entrar' %}">Já tenho uma conta</a></div>
        </section>
    </main>
</body>
</html>
